spring.application.name=appresso-backend
server.port=8080

# --- Base de datos (PostgreSQL) ---
# Lee las variables DB_* del archivo backend/.env si existe. En un servidor
# (producción) no hay .env: ahí las variables vienen del entorno del proveedor.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:appresso}
spring.datasource.username=${DB_USER:appresso}
spring.datasource.password=${DB_PASSWORD}

# Las tablas las crea Flyway al arrancar, con los scripts de src/main/resources/db/migration
# (V1__esquema_inicial.sql, V2__..., en orden). Hibernate NO crea ni modifica tablas: solo
# valida que las entidades coincidan con lo que dejó Flyway; si no coinciden, el backend no arranca.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
# Los instantes se guardan siempre en UTC, sin depender de la zona del servidor.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Evita abrir una consulta a la base durante el render de la respuesta.
spring.jpa.open-in-view=false

# --- Estado del servicio ---
# /actuator/health/db muestra solo UP o DOWN (sin detalles internos).
management.endpoint.health.show-components=always

# --- Zona horaria del negocio ---
# Define qué es "hoy" para jornadas de caja y vigencia de promociones (ver ZonaHorariaConfig).
appresso.zona-horaria=America/Bogota
