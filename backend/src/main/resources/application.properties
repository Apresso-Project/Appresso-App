spring.application.name=appresso-backend
server.port=8080

# --- Base de datos (PostgreSQL) ---
# Lee las variables DB_* del archivo backend/.env si existe. En un servidor
# (producción) no hay .env: ahí las variables vienen del entorno del proveedor.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:appresso}
spring.datasource.username=${DB_USER:appresso}
spring.datasource.password=${DB_PASSWORD}

# Las tablas las crea Flyway al arrancar, con los scripts de src/main/resources/db/migration
# (V1__esquema_inicial.sql, V2__..., en orden). Hibernate NO crea ni modifica tablas: solo
# valida que las entidades coincidan con lo que dejó Flyway; si no coinciden, el backend no arranca.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
# Los instantes se guardan siempre en UTC, sin depender de la zona del servidor.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Evita abrir una consulta a la base durante el render de la respuesta.
spring.jpa.open-in-view=false

# --- Estado del servicio ---
# /actuator/health/db muestra solo UP o DOWN (sin detalles internos).
management.endpoint.health.show-components=always

# --- Zona horaria del negocio ---
# Define qué es "hoy" para jornadas de caja y vigencia de promociones (ver ZonaHorariaConfig).
appresso.zona-horaria=America/Bogota

# --- Autenticación (token JWT) ---
# JWT_SECRET firma los tokens de sesión: mínimo 32 caracteres, distinta en cada entorno y fuera del
# repositorio (en backend/.env o en las variables del servidor). Sin ella el backend no arranca.
# Se deja vacía por defecto para que el error sea el mensaje de JwtProperties y no un "placeholder".
appresso.jwt.secret=${JWT_SECRET:}
# Vigencia del token en minutos (720 = 12 horas).
appresso.jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:720}

# --- Datos de prueba (solo desarrollo) ---
# Solo se usan con el perfil "dev" (spring.profiles.active=dev en backend/.env): el backend crea
# este administrador al arrancar si no existe. No definir estas variables ni el perfil en un servidor.
appresso.dev.admin-correo=${DEV_ADMIN_CORREO:admin@appresso.test}
appresso.dev.admin-contrasena=${DEV_ADMIN_CONTRASENA:}
