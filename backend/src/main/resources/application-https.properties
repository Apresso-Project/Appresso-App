# Perfil "https" (opcional, solo para probar HTTPS en local). Se activa sumándolo al perfil:
#   spring.profiles.active=dev,https      (en backend/.env)
# Necesita un certificado de prueba en backend/certs/ (ver docs/seguridad-y-ley-1581.md, 1.2).
# En producción NO se usa: allí el TLS lo termina el proxy o balanceador del servidor (8.5.1).
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=${HTTPS_KEYSTORE:file:certs/appresso-local.p12}
server.ssl.key-store-password=${HTTPS_KEYSTORE_CLAVE:}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=appresso
appresso.seguridad.exigir-https=true
