# Configuración SOLO para las pruebas.
# Este archivo reemplaza al de src/main/resources mientras se ejecutan las pruebas,
# así que ./gradlew test no necesita Docker ni el archivo .env.
spring.application.name=appresso-backend

# H2 en memoria, en modo compatible con PostgreSQL.
spring.datasource.url=jdbc:h2:mem:appresso;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Las pruebas usan las MISMAS migraciones de Flyway que producción (en H2). Hibernate solo valida
# que las entidades coincidan con el script: si alguien cambia una entidad sin migración, falla.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
appresso.zona-horaria=America/Bogota

# Clave de firma solo para las pruebas (no se usa fuera de ellas).
appresso.jwt.secret=clave-solo-para-pruebas-0123456789-abcdefghij
appresso.jwt.expiracion-minutos=30
