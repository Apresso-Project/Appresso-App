plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.appresso'
version = '0.0.1-SNAPSHOT'

// Compila para Java 21 con cualquier JDK 21 o superior instalado.
tasks.withType(JavaCompile).configureEach {
	options.release = 21
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// Autenticacion (2.1.1): BCrypt para las contrasenas y JWT para el token de sesion.
	// Se usa solo spring-security-crypto, NO el starter de seguridad (esa capa es de 2.3.1).
	implementation 'org.springframework.security:spring-security-crypto'
	// Control de acceso por rol (2.3.1): filtro JWT, 401/403 y reglas por rol.
	implementation 'org.springframework.boot:spring-boot-starter-security'
	// Boot no administra esta version; es la misma que usa Spring Security 7.1.x (para 2.3.1).
	implementation 'com.nimbusds:nimbus-jose-jwt:10.9.1'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	testRuntimeOnly 'com.h2database:h2'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
